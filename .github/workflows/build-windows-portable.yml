name: build-windows-portable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-x64-portable:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nextleek-v2/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nextleek-v2 -> nextleek-v2/target

      - name: Install frontend dependencies
        working-directory: nextleek-v2
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Inspect Tauri project
        working-directory: nextleek-v2/apps/desktop
        shell: pwsh
        run: |
          rustc --version --verbose
          cargo --version --verbose
          Get-Location
          Get-Content src-tauri\Cargo.toml
          Get-Content src-tauri\tauri.conf.json
          pnpm exec tauri info

      - name: Test and build frontend
        working-directory: nextleek-v2
        shell: pwsh
        run: |
          pnpm test
          pnpm typecheck
          pnpm build

      - name: Build Tauri installer and updater artifacts
        working-directory: nextleek-v2/apps/desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'TAURI_SIGNING_PRIVATE_KEY repository secret is not configured' }
          $version = if ('${{ github.ref }}'.StartsWith('refs/tags/v')) { '${{ github.ref_name }}'.TrimStart('v') } else { '0.1.0' }
          $config = Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          $config.version = $version
          $config | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 src-tauri\tauri.conf.json
          pnpm exec tauri build --target x86_64-pc-windows-msvc --verbose 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\tauri-build.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:GITHUB_WORKSPACE\tauri-build.log"; exit $LASTEXITCODE }

      - name: Inspect built artifacts
        shell: pwsh
        run: |
          $targetRoots = @(
            'nextleek-v2\target'
            'nextleek-v2\apps\desktop\src-tauri\target'
          ) | Where-Object { Test-Path $_ }
          "Target roots: $($targetRoots -join ', ')" | Set-Content -Encoding utf8 artifact-inventory.txt
          if ($targetRoots) {
            Get-ChildItem $targetRoots -Recurse -File |
              Where-Object { $_.Extension -in @('.exe', '.json', '.sig') } |
              Select-Object FullName, Length |
              Format-Table -AutoSize |
              Out-File -Append -Encoding utf8 artifact-inventory.txt
          }
      - name: Upload artifact inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextleek-artifact-inventory
          path: artifact-inventory.txt
          if-no-files-found: warn
      - name: Upload Tauri build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextleek-tauri-build-log
          path: tauri-build.log
          if-no-files-found: warn
      - name: Assemble release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targetRoots = @(
            'nextleek-v2\target'
            'nextleek-v2\apps\desktop\src-tauri\target'
          ) | Where-Object { Test-Path $_ }
          if (-not $targetRoots) { throw 'No Tauri target directory found' }
          $exe = Get-ChildItem $targetRoots -Recurse -File -Filter '*.exe' |
            Where-Object { $_.FullName -notmatch '\\bundle\\' } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $exe) { throw 'Portable executable not found in Tauri target directories' }
          $latest = Get-ChildItem $targetRoots -Recurse -File -Filter 'latest.json' | Select-Object -First 1
          if (-not $latest) { throw 'latest.json not found in Tauri target directories' }
          $bundle = $latest.Directory
          $portable = 'artifact\NextLeek-portable-windows-x64'
          New-Item -ItemType Directory -Force "$portable\Data" | Out-Null
          Copy-Item $exe.FullName "$portable\NextLeek.exe"
          "NextLeek Creator Windows x64 Portable`n`nExtract this directory and run NextLeek.exe.`nWebView2 Evergreen Runtime is required." | Set-Content -Encoding utf8 "$portable\README.txt"
          $installer = Get-ChildItem $targetRoots -Recurse -File -Filter '*setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not found in Tauri target directories' }
          Copy-Item $installer.FullName 'artifact\NextLeek-Creator-windows-x64-setup.exe'
          $updater = Get-ChildItem $bundle.FullName -Recurse -File | Where-Object { $_.Name -eq 'latest.json' -or $_.Extension -eq '.sig' }
          $updater | ForEach-Object { Copy-Item $_.FullName (Join-Path 'artifact' $_.Name) }
          if (-not (Test-Path 'artifact\latest.json')) { throw 'Updater latest.json copy failed' }
          $source = 'artifact\NextLeek-portable-windows-x64'
          $zip = 'artifact\NextLeek-portable-windows-x64.zip'
          Compress-Archive -Path $source -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  NextLeek-portable-windows-x64.zip" | Set-Content -Encoding ascii "$zip.sha256"
          if (-not (Test-Path 'artifact\latest.json')) { throw 'latest.json missing' }
          if (-not (Test-Path 'artifact\NextLeek-Creator-windows-x64-setup.exe')) { throw 'Installer missing' }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NextLeek-windows-x64-release
          path: artifact/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifact/*
          generate_release_notes: true
