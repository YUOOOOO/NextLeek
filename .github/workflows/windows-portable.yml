name: Desktop Windows release

on:
  push:
    branches: [v4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'YUOOOOO/NextLeek' && github.ref == 'refs/heads/v4'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # LMDB's upstream Windows builds use Node-API, not private V8 symbols.
      ENABLE_V8_FUNCTIONS: 'false'
      ENABLE_FAST_API_CALLS: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a new release version
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { version } = JSON.parse(require('node:fs').readFileSync('package.json', 'utf8'))
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Release version must be stable semver')
            const tag = `v${version}`
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` })
              throw new Error(`${tag} already exists. Bump package.json version; tags are never overwritten.`)
            } catch (error) {
              if (error.status !== 404) throw error
            }
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag })
              throw new Error(`${tag} release already exists (possibly a draft). Resolve explicitly; never overwrite.`)
            } catch (error) {
              if (error.status !== 404) throw error
            }
            core.setOutput('version', version)
            core.setOutput('tag', tag)
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        shell: pwsh
        run: |
          $output = @(pnpm install --frozen-lockfile 2>&1)
          $installExit = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($installExit -ne 0) {
            $errors = @($output | Where-Object { "$_" -match '(?i)error|fatal|failed|gyp ERR|MSB[0-9]+' })
            $failure = ($errors | Select-Object -First 20) -join "`n"
            $failure = $failure.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Dependency installation failed::$failure"
            exit $installExit
          }
      - run: pnpm typecheck
      - run: pnpm gates
      - run: pnpm test
      - run: pnpm build:win
      - name: Package lower-version installed baseline for real update smoke
        shell: pwsh
        run: |
          # Test-only installer: same source, lower version; never uploaded or published.
          # All stable v4 releases compare greater than 4.0.0.
          pnpm exec electron-builder --win nsis --x64 --publish never -c.extraMetadata.version=4.0.0 -c.directories.output=artifacts/update-baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extract and exercise portable application
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem release -Filter '*.zip' -File)
          if ($zip.Count -ne 1) { throw 'Expected exactly one portable ZIP' }
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath artifacts/portable
          $exe = @(Get-ChildItem artifacts/portable -Filter '*.exe' -Recurse -File | Where-Object { $_.Name -notmatch 'crashpad|uninstall' })
          if ($exe.Count -ne 1) { throw 'Expected exactly one application executable' }
          node scripts/smoke-desktop.mjs $exe[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -LiteralPath $zip[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($zip[0].Name)" | Set-Content -LiteralPath "$($zip[0].FullName).sha256" -Encoding ascii
      - name: Install and exercise NSIS application
        id: installed
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem release -Filter '*-Setup.exe' -File)
          if ($setup.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          if (!(Test-Path "$($setup[0].FullName).blockmap")) { throw 'Missing installer blockmap' }
          if (!(Test-Path 'release/latest.yml')) { throw 'Missing latest.yml update metadata' }
          $installDirectory = Join-Path $env:RUNNER_TEMP 'NextLeek-installed'
          $installer = Start-Process -FilePath $setup[0].FullName -ArgumentList '/S', "/D=$installDirectory" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "NSIS install failed: $($installer.ExitCode)" }
          $exe = Join-Path $installDirectory 'NextLeek.exe'
          if (!(Test-Path $exe) -or !(Test-Path (Join-Path $installDirectory 'Uninstall NextLeek.exe'))) { throw 'NSIS installation is incomplete' }
          "executable=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          node scripts/smoke-desktop.mjs $exe --expect-update-supported
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextleek-windows-x64
          path: |
            release/*.zip
            release/*.sha256
            release/*-Setup.exe
            release/*-Setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30
      - name: Publish immutable GitHub release after packaged smoke
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Name -match '\.zip$|\.sha256$|-Setup\.exe$|-Setup\.exe\.blockmap$|^latest\.yml$' } | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 5) { throw 'Expected ZIP, checksum, NSIS installer, blockmap, and latest.yml' }
          $notes = 'Windows: install Setup.exe for check/download/restart-install online updates. Incremental download uses blockmaps and falls back to the full installer when needed. Portable ZIP cannot auto-install updates; install Setup.exe first. Windows binaries are unsigned and may show SmartScreen warnings. macOS/Linux and development builds require manual updates. Future releases must bump package.json; tags are never overwritten.'
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "NextLeek $env:RELEASE_TAG" --notes $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify anonymous update feed and installed update check
        shell: pwsh
        env:
          INSTALLED_EXE: ${{ steps.installed.outputs.executable }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          # Download anonymously: the shipped updater has no GitHub credentials.
          $release = Invoke-RestMethod "https://api.github.com/repos/YUOOOOO/NextLeek/releases/tags/$env:RELEASE_TAG"
          foreach ($asset in $release.assets) {
            if ($asset.name -match '-Setup\.exe$|-Setup\.exe\.blockmap$|^latest\.yml$') {
              $destination = Join-Path $env:RUNNER_TEMP $asset.name
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $destination
              $local = Join-Path 'release' $asset.name
              if ((Get-FileHash $destination -Algorithm SHA512).Hash -ne (Get-FileHash $local -Algorithm SHA512).Hash) { throw "Public release asset mismatch: $($asset.name)" }
            }
          }
          node scripts/smoke-desktop.mjs $env:INSTALLED_EXE --expect-update-supported --check-updates
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise real installed check download and relaunch-install
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $baseline = @(Get-ChildItem artifacts/update-baseline -Filter '*-Setup.exe' -File)
          if ($baseline.Count -ne 1) { throw 'Expected one lower-version test installer' }
          node scripts/smoke-update.mjs $baseline[0].FullName $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload desktop behavior evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-evidence
          path: |
            artifacts/smoke/
            artifacts/update-smoke/
          if-no-files-found: ignore
          retention-days: 14
