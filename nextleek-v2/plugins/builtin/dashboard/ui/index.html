<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仪表盘</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dashboard">
    <header class="hero">
      <p class="eyebrow">NEXTLEEK</p>
      <h1>基础仪表盘</h1>
      <p class="subtitle">插件已运行。用 Alt+Space 搜索命令。</p>
    </header>
    <section class="stats" aria-label="运行概览">
      <article class="card"><span>当前日期</span><strong id="date">加载中…</strong></article>
      <article class="card"><span>版本</span><strong id="version">读取中…</strong></article>
      <article class="card"><span>运行状态</span><strong id="status" class="success">运行正常</strong></article>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
