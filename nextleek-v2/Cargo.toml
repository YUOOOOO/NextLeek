[workspace]
members = ["crates/kernel", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
nextleek-kernel = { path = "crates/kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
semver = "1"
regex = "1"
tempfile = "3"
zip = { version = "2.2", default-features = false }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
