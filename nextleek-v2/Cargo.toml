[workspace]
members = ["crates/kernel", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
nextleek-kernel = { path = "crates/kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
semver = "1"
regex = "1"
tempfile = "3"
