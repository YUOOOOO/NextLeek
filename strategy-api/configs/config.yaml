# OHLCV factors available for WFO / sealed combos
active_factors:
  - MOM_20D
  - MOM_60D
  - SHARPE_RATIO_20D
  - VOL_20D
  - MAX_DD_60D
  - PRICE_POSITION_20D
  - PRICE_POSITION_120D
  - BREAKOUT_20D
  - SLOPE_20D
  - CALMAR_RATIO_60D

# Higher is better after sign flip for VOL/MAX_DD
factor_signs:
  MOM_20D: 1
  MOM_60D: 1
  SHARPE_RATIO_20D: 1
  VOL_20D: -1
  MAX_DD_60D: -1
  PRICE_POSITION_20D: 1
  PRICE_POSITION_120D: 1
