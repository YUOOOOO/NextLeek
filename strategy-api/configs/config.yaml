wfo:
  mode: smoke # smoke | full
  combo_sizes: [2, 3]
  max_combos: 80
  train_ratio: 0.7
  ic_threshold: 0.02
  top_n_vec: 10
  top_n_bt: 5
  scoring:
    return: 0.4
    sharpe: 0.3
    maxdd: 0.3

sealed:
  - id: momentum_core
    name: MOM+Sharpe core
    factors: [MOM_20D, SHARPE_RATIO_20D, PRICE_POSITION_120D]
  - id: dual_mom
    name: Dual momentum
    factors: [MOM_20D, MOM_60D, VOL_20D]
