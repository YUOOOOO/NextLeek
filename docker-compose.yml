services:
  nextleek:
    build: .
    image: nextleek:local
    container_name: nextleek
    restart: unless-stopped
    ports:
      - "3018:3018"
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /app/data
      TIERS_YAML: /app/tiers.yaml
      NEXTLEEK_STATIC_DIR: /app/static
      NEXTLEEK_DATABASE_URL: sqlite:////app/data/nextleek.db
      NEXTLEEK_CORS_ORIGINS: http://localhost:3018,https://leek.yuchaoqun.com
      NEXTLEEK_COOKIE_SECURE: "false"
    volumes:
      - nextleek-data:/app/data
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  nextleek-data:
