[project]
name = "nextleek-backend"
version = "0.1.0"
description = "NextLeek multi-user stock research backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.2,<3",
    "python-multipart>=0.0.6",
    "sse-starlette>=2.0",
    "polars>=1.44,<1.45",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "pandas>=2.2",
    "psutil>=5.9",
    "numba>=0.65.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "fastexcel>=0.10",
    "pypinyin>=0.50",
    "tickflow[all]>=0.1.23",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "plyer>=2.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23",
    "ruff>=0.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
