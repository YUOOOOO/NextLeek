appId: com.nextleek.desktop
productName: NextLeek
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - '**/*.node'
  - '**/lmdb/**'
  - '**/@lmdb/**'
  - '**/msgpackr-extract/**'
  - '**/@msgpackr-extract/**'
npmRebuild: true
nativeRebuilder: sequential
artifactName: 'NextLeek-${version}-${os}-${arch}.${ext}'
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  signAndEditExecutable: true
  publish:
    provider: github
    owner: YUOOOOO
    repo: NextLeek
    releaseType: release
    publishAutoUpdate: true
nsis:
  artifactName: 'NextLeek-${version}-win-${arch}-Setup.${ext}'
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  differentialPackage: true
mac:
  category: public.app-category.productivity
  target: [zip]
linux:
  category: Utility
  target: [tar.gz]
