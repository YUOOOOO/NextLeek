appId: com.nextleek.desktop
productName: NextLeek
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - '**/*.node'
  - '**/lmdb/**'
  - '**/@lmdb/**'
  - '**/msgpackr-extract/**'
  - '**/@msgpackr-extract/**'
npmRebuild: true
nativeRebuilder: sequential
artifactName: 'NextLeek-${version}-${os}-${arch}.${ext}'
win:
  target:
    - target: zip
      arch: [x64]
  signAndEditExecutable: false
mac:
  category: public.app-category.productivity
  target: [zip]
linux:
  category: Utility
  target: [tar.gz]
